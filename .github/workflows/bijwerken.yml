name: Data bijwerken

on:
  schedule:
    - cron: "30 */3 * * *"   # meerdere keren per dag; Infrabel publiceert de gegevens van gisteren één keer per dag
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bijwerken
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gegevens ophalen en samenvatten (D-1, officiële cijfers, ontbrekende archiefmaanden)
        run: python src/pijplijn.py

      - name: Dashboard bouwen
        run: python src/dashboard.py

      - name: Wijzigingen bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Geen nieuwe gegevens."
          else
            git commit -m "Data-update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
